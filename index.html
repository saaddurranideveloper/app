<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saad Durrani - Developer</title>
<meta name="description" content="Saad Durrani: developer and WordPress specialist. Web development, web design, maintenance and e-commerce.">
<meta name="theme-color" content="#F6E3BF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--teal:#3D6B72;--deep:#24444A;--amber:#D98A0B;--soft:#F6E3BF;--sheet:#FFFCF6;--cream:#FBEFD6;--ink:#1D2B2E;--mute:#5F6F72;--line:#EADFC8;--bot:70px;--e:cubic-bezier(.22,.9,.32,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--soft);color:var(--ink);overflow:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
/* header */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;background:var(--soft)}
.avatar-b{width:42px;height:42px;flex-shrink:0;border-radius:50%;overflow:hidden;display:block}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(36,68,74,.25);transition:transform .25s var(--e)}
.avatar:hover{transform:scale(1.1) rotate(-3deg)}
.search{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:42px;border-radius:21px;background:#FFF7E6;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mute);text-align:left;transition:box-shadow .2s}
.search:hover{box-shadow:0 4px 14px rgba(36,68,74,.15)}
.search svg{width:18px;height:18px}
.tog{width:42px;height:42px;border-radius:14px;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.tog:hover{background:var(--amber);transform:rotate(90deg)}
/* sheet */
main{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--sheet);border-radius:28px 28px 0 0;overflow-y:auto;padding:22px 16px calc(var(--bot) + env(safe-area-inset-bottom,0px) + 24px)}
.view{display:none;max-width:760px;margin:0 auto}.view.on{display:block;animation:in .3s var(--e)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3{color:var(--deep);line-height:1.2}
.pt{font-size:30px;font-weight:800;letter-spacing:-.02em}.pt i{font-style:normal;color:var(--amber)}
.lead{color:var(--mute);margin:6px 0 18px}
h2.sh{font-size:19px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sh a{font-size:13px;color:var(--teal);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;transition:transform .25s var(--e),box-shadow .25s}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(36,68,74,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:24px;font-weight:700;font-size:14px;border:2px solid var(--teal);color:var(--teal);transition:all .2s var(--e);cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(36,68,74,.2)}
.btn.f{background:var(--amber);border-color:var(--amber);color:#fff}.btn.f:hover{background:#C27806;border-color:#C27806}
.btn.d{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* hero banner */
.hero{border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#24444A,#3D6B72);color:#fff;position:relative}
.hero svg.art{display:block;width:100%;height:auto;stroke:none}
.hero .tx{padding:4px 20px 22px}
.hero h1{color:#fff;font-size:28px;font-weight:800;letter-spacing:-.02em}.hero h1 em{font-style:normal;color:#F2B544}
.hero p{color:#D5E4E6;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--teal)}.stat span{font-size:12px;color:var(--mute)}
/* lists + chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{flex-shrink:0;padding:9px 16px;border-radius:20px;background:var(--cream);font-weight:600;font-size:13.5px;color:var(--deep);transition:all .2s}
.chip:hover,.chip.on{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.proj{padding:0;overflow:hidden;display:block}
.proj img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;background:var(--cream);transition:transform .5s var(--e)}
.proj:hover img{transform:scale(1.05)}.proj .im{overflow:hidden}
.proj div.b{padding:12px 14px}.proj h3{font-size:16px}.proj p{font-size:13px;color:var(--mute)}
.ic{width:46px;height:46px;border-radius:14px;background:var(--cream);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s var(--e)}
.lift:hover .ic{background:var(--teal);color:#fff;transform:rotate(-8deg) scale(1.08)}
.rowc{display:flex;gap:14px;align-items:center}.rowc h3{font-size:16px}.rowc p{font-size:13.5px;color:var(--mute)}
.stars{color:var(--amber);letter-spacing:2px}
.av{width:42px;height:42px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar{height:7px;background:var(--cream);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#F2B544);border-radius:4px}
.sk{padding:8px 0}.sk span{display:flex;justify-content:space-between;font-size:14px}
.steps{counter-reset:s;display:grid;gap:10px}.steps .card{display:flex;gap:14px;counter-increment:s}
.steps .card::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--amber);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.steps h3{font-size:15px}.steps p{font-size:13.5px;color:var(--mute)}
.pol h2{font-size:17px;margin:20px 0 6px}.pol p,.pol li{color:#3E4E51;font-size:14.5px}.pol ul{margin:6px 0 0 20px}
/* pricing table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:#fff;margin:12px 0}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:600;color:var(--deep);min-width:130px;z-index:1}
thead th{background:var(--cream);vertical-align:top;border-bottom:0}
thead th b{display:block;color:var(--deep);font-size:15px}
thead th .p{display:block;font-size:24px;font-weight:800;color:var(--amber);margin-top:2px}thead th small{color:var(--mute);font-weight:500}
th.hot{background:var(--teal)}th.hot b{color:#fff}th.hot .p{color:#F2B544}th.hot small{color:#D5E4E6}
td.hot{background:#F3F8F8}tr:last-child td{border-bottom:0}
.yes{color:#2E9A5A;font-weight:800}.no{color:#B8B8B8}
/* socials */
.soc{display:flex;gap:12px;flex-wrap:wrap}
.so{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .2s var(--e),box-shadow .2s}
.so svg{width:20px;height:20px;stroke:none}.so:hover{transform:translateY(-4px) scale(1.1);box-shadow:0 10px 18px rgba(0,0,0,.25)}
.so.fb{background:#fff;border:1px solid var(--line)}.so.fb svg{width:100%;height:100%}.so.tt,.so.x{background:#000}.so.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}.so.in{background:#0A66C2}
/* forms */
.fld{display:grid;gap:6px;margin-bottom:14px}.fld label{font-weight:600;font-size:13px;color:var(--deep)}
.fld input,.fld select,.fld textarea{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;width:100%;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,138,11,.18)}
.fld textarea{min-height:110px;resize:vertical}.fld.err input,.fld.err textarea{border-color:#C25450}
.fld small{display:none;color:#C25450}.fld.err small{display:block}
.ok{display:none;text-align:center;padding:24px 8px}.ok.on{display:block}

.fld.err select{border-color:#C25450}
.plans{display:grid;gap:22px;margin:22px 0 12px}
@media(min-width:700px){.plans{grid-template-columns:repeat(3,1fr);gap:14px}}
.plan{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px 18px 18px;position:relative;display:flex;flex-direction:column;transition:transform .25s var(--e),box-shadow .25s}
.plan:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(36,68,74,.18)}
.plan h3{font-size:18px}.plan .pp{font-size:36px;font-weight:800;color:var(--amber);line-height:1.1;margin-top:6px}.plan .per{color:var(--mute);font-size:13px}
.plan ul{list-style:none;margin:14px 0 18px;flex:1}
.plan li{padding:8px 0 8px 26px;position:relative;font-size:14px;border-bottom:1px dashed var(--line)}
.plan li::before{content:"\2713";position:absolute;left:2px;color:#2E9A5A;font-weight:800}
.plan li.off{color:#A9A9A9;text-decoration:line-through}.plan li.off::before{content:"\2013";color:#BBB}
.plan .btn{width:100%}
.plan.hot{background:var(--deep);border:2px solid var(--amber);color:#E4EDEB}
.plan.hot h3{color:#fff}.plan.hot .per{color:#BFD3D6}.plan.hot li{border-color:rgba(255,255,255,.18)}.plan.hot li.off{color:#7E9599}.plan.hot li::before{color:#F2B544}
.rec{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--amber);color:#fff;font-size:12px;font-weight:800;padding:5px 16px;border-radius:14px;white-space:nowrap;box-shadow:0 4px 10px rgba(217,138,11,.4)}
.hlogo{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:12px;background:#fff;padding:3px;z-index:20}
.cf{position:relative;height:170px;margin-top:20px;touch-action:pan-y;overflow:hidden;outline:0}
@media(min-width:620px){.cf{height:240px}}
.sl{position:absolute;left:50%;top:8px;width:min(62%,320px);aspect-ratio:16/11;background:#fff;padding:5px;border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.4);cursor:pointer;transition:transform .55s var(--e),opacity .4s,filter .4s}
.sl .ph{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#F6E3BF,#D98A0B);border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:36px}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.cfa{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:22px;line-height:1;z-index:30;transition:background .2s}
.cfa:hover{background:var(--amber)}.cfa.l{left:6px}.cfa.r{right:6px}
.cap{text-align:center;color:#fff;margin-top:4px}.cap span{color:#BFD3D6;font-size:13px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}.dots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);transition:all .3s}.dots button.on{width:22px;background:var(--amber)}

/* ---- motion ---- */
.rv{opacity:0;transform:translateY(26px) scale(.98)}
.rv.vis{opacity:1;transform:none;transition:opacity .6s var(--e),transform .7s var(--e)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes pop{0%{transform:translateY(0) scale(.6)}60%{transform:translateY(-22px) scale(1.12)}100%{transform:translateY(-16px) scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 4px 10px rgba(217,138,11,.4)}50%{box-shadow:0 0 0 7px rgba(217,138,11,.18)}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{background-size:200% 200%;animation:shift 14s ease infinite}
.hlogo{animation:float 4s ease-in-out infinite}
.view.on .hero .tx>*{animation:fu .7s var(--e) both}
.view.on .hero .tx>*:nth-child(2){animation-delay:.12s}.view.on .hero .tx>*:nth-child(3){animation-delay:.24s}
.rec{animation:pulse 2.4s ease-in-out infinite}
.nav a.on .ni{animation:pop .5s var(--e) both}
aside.on .sb>*{animation:slideIn .45s var(--e) both}
aside.on .sb>*:nth-child(2){animation-delay:.05s}aside.on .sb>*:nth-child(3){animation-delay:.1s}aside.on .sb>*:nth-child(4){animation-delay:.15s}aside.on .sb>*:nth-child(5){animation-delay:.2s}aside.on .sb>*:nth-child(6){animation-delay:.25s}aside.on .sb>*:nth-child(n+7){animation-delay:.3s}
.bar i{width:0;transition:width 1.1s var(--e)}
.btn:active,.chip:active,.tog:active{transform:scale(.96)}
.chip{transition:all .25s var(--e)}.chip:hover{transform:translateY(-2px)}
.so{animation:fu .6s var(--e) both}.so:nth-child(2){animation-delay:.06s}.so:nth-child(3){animation-delay:.12s}.so:nth-child(4){animation-delay:.18s}.so:nth-child(5){animation-delay:.24s}
/* ---- responsive ---- */
.pt{font-size:clamp(26px,5.4vw,40px)}.hero h1{font-size:clamp(26px,5.6vw,42px)}
.view img,.sheet img{max-width:100%}
.modal .sheet{max-height:92vh;max-height:92dvh}
@media(max-width:360px){:root{--bot:64px}.nav a{font-size:10.5px}.nav a.on .ni{width:48px;height:48px}.search{padding:0 10px}.btn{padding:10px 16px}.plan .pp{font-size:30px}.hero .tx{padding:4px 14px 18px}.cf{height:150px}.sh1 b{font-size:14px}}
@media(min-width:620px){main{padding-left:28px;padding-right:28px}.hero .tx{padding:6px 28px 28px}}
@media(min-width:900px){
 .view{max-width:1040px}.top{padding-left:max(14px,calc((100vw - 1040px)/2));padding-right:max(14px,calc((100vw - 1040px)/2))}
 .hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;padding:24px 14px 24px 8px}
 .hero .tx{padding:6px 18px}.cf{height:260px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
 .stats{gap:16px}.stat b{font-size:28px}
 .nav{max-width:640px}
}
@media(max-height:460px) and (orientation:landscape){.cf{height:130px}.nav{--bot:56px}.big{width:80px;height:80px}}
/* bottom nav (raised active circle) */
.nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:var(--bot);z-index:20;background:var(--cream);border-radius:26px;display:flex;box-shadow:0 -4px 24px rgba(36,68,74,.14);max-width:620px;margin:0 auto}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute);position:relative}
.nav a .ni{display:flex;align-items:center;justify-content:center;width:34px;height:34px;transition:all .3s var(--e);border-radius:50%}
.nav a:hover .ni{transform:translateY(-3px);color:var(--teal)}
.nav a.on{color:var(--deep)}
.nav a.on .ni{width:54px;height:54px;background:var(--teal);color:#fff;transform:translateY(-16px);border:5px solid var(--sheet);box-shadow:0 8px 16px rgba(61,107,114,.4);margin-bottom:-14px}
/* sidebar */
.scrim{position:fixed;inset:0;background:rgba(20,35,38,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;right:0;width:50vw;min-width:270px;max-width:360px;z-index:50;background:var(--sheet);transform:translateX(105%);transition:transform .35s var(--e);display:flex;flex-direction:column;border-radius:26px 0 0 26px;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
aside.on{transform:none}
.sh1{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sh1 img{width:44px;height:44px;border-radius:12px}.sh1 b{flex:1;color:var(--deep);line-height:1.2}.sh1 small{display:block;color:var(--mute);font-weight:500}
.x1{width:36px;height:36px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;transition:transform .25s}.x1:hover{transform:rotate(90deg);background:var(--amber);color:#fff}
.sb{flex:1;overflow-y:auto;padding:10px}
.sb a,.sb button.dd{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;font-weight:600;color:var(--deep);transition:all .2s;text-align:left}
.sb a:hover,.sb button.dd:hover,.sb a.on{background:var(--cream);padding-left:18px}
.sb a.on{color:var(--teal)}.sb svg{color:var(--teal)}
.sub{display:none;margin:2px 0 6px 26px;border-left:2px solid var(--line)}.sub.on{display:block}.sub a{font-weight:500;padding:9px 12px;font-size:14px}
.dd .ch{margin-left:auto;transition:transform .25s}.dd.on .ch{transform:rotate(180deg)}
.sf{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line);display:grid;gap:12px}
.sf .soc{justify-content:center;gap:8px}.sf .so{width:36px;height:36px}.sf .so svg{width:17px;height:17px}.sf .btn{width:100%}
/* modals */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,35,38,.55)}
.modal.on{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .35s var(--e);position:relative}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .x1{position:absolute;top:14px;right:14px}
.big{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 20px rgba(36,68,74,.3);cursor:zoom-in;transition:transform .25s var(--e);display:block;margin:0 auto 10px}.big:hover{transform:scale(1.06)}
.tc{text-align:center}.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}.tags span{background:var(--cream);padding:4px 12px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--deep)}
.sin{width:100%;height:46px;border-radius:23px;border:2px solid var(--teal);padding:0 18px;font:inherit;margin:6px 0 12px;background:#fff}.sin:focus{outline:0;border-color:var(--amber)}
.res a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;transition:background .2s}.res a:hover{background:var(--cream)}
.res small{color:var(--mute);display:block;font-size:12.5px}.res h4{font-size:12px;color:var(--amber);margin:12px 0 2px;text-transform:none}
.lb{position:fixed;inset:0;z-index:80;background:rgba(14,24,23,.94);display:none;align-items:center;justify-content:center;padding:20px}.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:12px;border:6px solid #fff}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

  $('#v-services').innerHTML=`<h1 class="pt">Services <i>and pricing</i></h1><p class="lead">Starting prices. The final quote depends on pages, content and features.</p>
  <div class="chips">${Object.entries(SV).map(([id,v])=>`<a class="chip ${id===k?'on':''}" href="#services/${id}">${v.n}</a>`).join('')}</div>
  <div class="card" style="margin-top:12px"><div class="rowc"><span class="ic">${ic(s.i)}</span><div><h3>${s.n}</h3><p>${s.d}</p></div></div><ul style="margin:12px 0 0 20px;color:#3E4E51">${s.inc.map(x=>`<li>${x}</li>`).join('')}</ul></div>${tbl(k)}`;
}
$('#v-contact').innerHTML=`<h1 class="pt">Get in <i>touch</i></h1><p class="lead">Tell me what you need. I reply within a day.</p>
<div class="grid"><a class="card lift rowc" href="tel:${PHONE}"><span class="ic">${ic('phone')}</span><div><h3>Phone</h3><p>+92 323 3527130</p></div></a><a class="card lift rowc" href="mailto:${MAIL}"><span class="ic">${ic('mail')}</span><div><h3>Email</h3><p style="word-break:break-all">${MAIL}</p></div></a><div class="card lift rowc"><span class="ic">${ic('pin')}</span><div><h3>Location</h3><p>Bahawalpur, Punjab, Pakistan</p></div></div></div>
<div class="card" style="margin-top:6px"><form id="cf" novalidate><div id="ff"><div class="fld" id="f1"><label for="n">Full name</label><input id="n" autocomplete="name" placeholder="Your name"><small>Enter your name.</small></div><div class="fld" id="f2"><label for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com"><small>Enter a valid email.</small></div><div class="fld" id="f4"><label for="p">Phone number</label><input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="+92 300 0000000"><small>Enter a valid phone number with country code.</small></div><div class="fld" id="f5"><label for="c">Country</label><select id="c" autocomplete="country-name"><option value="">Select country</option>${COUNTRIES.map(c=>`<option>${c}</option>`).join('')}</select><small>Select your country.</small></div><div class="fld" id="f6"><label for="s">Service</label><select id="s"><option value="">Select service</option>${Object.values(SV).flatMap(v=>v.pl.map(p=>`<option>${v.n} - ${p[0]} (${p[1]})</option>`)).join('')}<option>Not sure yet</option></select><small>Select a service.</small></div><div class="fld"><label for="m">Message <span style="font-weight:400;color:var(--mute)">(optional)</span></label><textarea id="m" placeholder="Tell me about your project"></textarea></div><button class="btn f" style="width:100%" id="sb2">Send message</button></div><div class="ok" id="ok"><h2>Message sent</h2><p class="lead">Thanks. I will reply within a day.</p></div></form></div>
<h2 class="sh">Or message me directly</h2>${cbtn}<h2 class="sh">Follow me</h2><div class="soc">${socials}</div>`;
$('#v-privacy').innerHTML=`<h1 class="pt">Privacy <i>policy</i></h1><p class="lead">Last updated: October 2026</p><h2>What I collect</h2><p>When you use the contact form, I receive your name, email, chosen service and message. This app does not use accounts or tracking.</p><h2>How I use it</h2><ul><li>To reply to your enquiry and discuss your project</li><li>To send a quote or follow up on work you asked for</li></ul><h2>Sharing</h2><p>I do not sell your data. Form messages are delivered through the Web3Forms service to my email inbox.</p><h2>Third-party links</h2><p>Project and social links open other websites with their own privacy policies.</p><h2>Your choices</h2><p>Email ${MAIL} to ask me to delete your messages.</p>`;
$('#v-terms').innerHTML=`<h1 class="pt">Terms <i>and conditions</i></h1><p class="lead">Last updated: October 2026</p><h2>Quotes and payment</h2><p>Prices shown are starting prices. A final quote is agreed in writing before work begins, and payment terms are set in that quote.</p><h2>Revisions</h2><p>Each package includes the revisions listed in it. Extra changes may be charged.</p><h2>Content and ownership</h2><p>You confirm you own or may use the content you provide. After full payment, the finished website belongs to you.</p><h2>Delivery</h2><p>Delivery times start once I have your content and requirements. Delays in content may move the date.</p><h2>Liability</h2><p>I take care to test every site, but I am not liable for losses from third-party services, hosting or plugins.</p><h2>Contact</h2><p>Questions about these terms: ${MAIL}</p>`;

/* sidebar */
const sbl=(h,i,t)=>`<a href="${h}" data-nav>${ic(i)}${t}</a>`;
$('#sb').innerHTML=sbl('#home','home','Home')+sbl('#about','user','About')+sbl('#work','work','Projects')+`<button class="dd" id="dd" aria-expanded="false">${ic('tag')}Services<span class="ch">${ic('chev')}</span></button><div class="sub" id="sub">${Object.entries(SV).map(([k,v])=>`<a href="#services/${k}" data-nav>${v.n}</a>`).join('')}</div>`+sbl('#reviews','star','Reviews')+sbl('#contact','mail','Contact')+sbl('#privacy','shield','Privacy Policy')+sbl('#terms','doc','Terms and Conditions');
$('#sfSoc').innerHTML=socials;
$('#dd').onclick=e=>{const o=$('#sub').classList.toggle('on');e.currentTarget.classList.toggle('on',o);e.currentTarget.setAttribute('aria-expanded',o)};
const side=$('#side'),scrim=$('#scrim');
function menu(o){side.classList.toggle('on',o);scrim.classList.toggle('on',o);side.setAttribute('aria-hidden',!o);$('#openMenu').setAttribute('aria-expanded',o)}
$('#openMenu').onclick=()=>menu(true);$('#closeMenu').onclick=()=>menu(false);scrim.onclick=()=>menu(false);
$('#sb').addEventListener('click',e=>{if(e.target.closest('[data-nav]'))menu(false)});
$('.sf .btn').onclick=()=>menu(false);

/* profile popup */
function profile(){$('#profBody').innerHTML=`<button class="x1" data-close aria-label="Close"><svg><use href="#close"/></svg></button><div class="tc"><img class="big zoom" src="${PIC}" alt="Saad Durrani, tap to enlarge"><h2>Saad Durrani</h2><p style="color:var(--mute)">Software Engineer and Developer</p><p style="color:var(--mute)">${ic('pin').replace('<svg','<svg style="width:15px;height:15px;vertical-align:-3px"')} Bahawalpur, Punjab, Pakistan</p><div class="tags"><span>Open for new projects</span><span>WordPress</span><span>Elementor</span><span>Divi</span><span>Avada</span><span>Python</span></div></div><p style="margin:6px 0">1+ year at Yoan Systems building client sites. I build custom and WordPress websites that work on every device.</p>${cbtn}<div class="soc" style="justify-content:center;margin:16px 0">${socials}</div><div class="btns" style="justify-content:center"><a class="btn f" href="#contact" data-svc="">Book now</a><a class="btn" href="#about">Full profile</a></div>`}
profile();
$('#openProfile').onclick=()=>$('#mProfile').classList.add('on');
$('#mProfile').addEventListener('click',e=>{if(e.target.closest('a.btn[href^="#"]'))closeAll()});
/* photo lightbox */
document.addEventListener('click',e=>{const z=e.target.closest('.zoom');if(z){$('#lbImg').src=PIC;$('#lb').classList.add('on')}});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
function closeAll(){$$('.modal').forEach(m=>m.classList.remove('on'));$('#lb').classList.remove('on');menu(false)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.classList.remove('on')}));

/* search popup */
const IDX=[...WORK.map(w=>({g:'Projects',t:w[0],s:w[1],h:w[2],x:1,k:w.join(' ')})),...Object.entries(SV).map(([k,v])=>({g:'Services',t:v.n,s:v.d,h:'#services/'+k,k:v.n+v.d+v.inc.join(' ')})),...REV.map(r=>({g:'Reviews',t:r[0],s:r[2],h:'#reviews',k:r.join(' ')})),...SK.map(s=>({g:'Skills',t:s[0],s:s[1]+'%',h:'#about',k:s[0]})),...[['Home','#home'],['About','#about'],['Contact','#contact'],['Privacy Policy','#privacy'],['Terms and Conditions','#terms']].map(p=>({g:'Pages',t:p[0],s:'',h:p[1],k:p[0]}))];
$('#openSearch').onclick=()=>{$('#mSearch').classList.add('on');setTimeout(()=>$('#q').focus(),50)};
$('#q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){$('#res').innerHTML='';return}
 const r=IDX.filter(i=>i.k.toLowerCase().includes(q)),gs=[...new Set(r.map(i=>i.g))];
 $('#res').innerHTML=r.length?gs.map(g=>`<h4>${g}</h4>`+r.filter(i=>i.g===g).map(i=>`<a href="${i.h}" ${i.x?'target="_blank" rel="noopener"':''} data-sr><div><b>${i.t}</b><small>${i.s.slice(0,70)}</small></div></a>`).join('')).join(''):'<p class="lead">No results. Try "WordPress" or "store".</p>'};
$('#res').onclick=e=>{if(e.target.closest('[data-sr]'))closeAll()};

/* quote buttons preselect service */
let pick='';
document.addEventListener('click',e=>{const a=e.target.closest('[data-svc]');if(a){pick=a.dataset.svc;closeAll()}});
/* contact form */
$('#cf').onsubmit=async e=>{e.preventDefault();const g=i=>$(i).value.trim(),n=g('#n'),em=g('#e'),ph=g('#p'),co=g('#c'),sv=g('#s'),m=g('#m');
 const okE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em),okP=/^\+?[\d\s\-()]{7,20}$/.test(ph)&&ph.replace(/\D/g,'').length>=7;
 [['#f1',!n],['#f2',!okE],['#f4',!okP],['#f5',!co],['#f6',!sv]].forEach(([f,bad])=>$(f).classList.toggle('err',bad));
 if(!n||!okE||!okP||!co||!sv){const f=$('.fld.err');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});return}
 const b=$('#sb2');b.disabled=true;b.textContent='Sending...';
 try{const r=await(await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:KEY,subject:'New project inquiry - '+sv,name:n,email:em,phone:ph,country:co,service:sv,message:m||'(no message)'})})).json();
  if(!r.success)throw 0;$('#ff').style.display='none';$('#ok').classList.add('on');e.target.reset()}
 catch(x){alert('Sending failed. Please email '+MAIL+' directly.')}
 b.disabled=false;b.textContent='Send message'};

document.addEventListener('error',e=>{if(e.target.matches&&e.target.matches('img.avatar,img.big')){e.target.onerror=null;e.target.src='logo.png'}},true);

/* scroll reveal + counters + skill bars */
const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);const d=el._d||0;el.style.transitionDelay=d+'ms';el.classList.add('vis');setTimeout(()=>{el.classList.remove('rv','vis');el.style.transitionDelay=''},950+d)}),{root:$('#main'),threshold:.08,rootMargin:'0px 0px -4% 0px'});
function reveal(v){let i=0;v.querySelectorAll('.pt,.lead,.hero,.stat,.card,.plan,.chips,h2.sh,.soc').forEach(el=>{el.classList.remove('vis');el.classList.add('rv');el._d=Math.min(i++,7)*70;io.observe(el)});
 v.querySelectorAll('.stat b').forEach(b=>{const t=parseInt(b.textContent),suf=b.textContent.replace(/\d+/,'');if(!b.dataset.t){b.dataset.t=t;b.dataset.s=suf}const T=+b.dataset.t,S=b.dataset.s,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1000);b.textContent=Math.round(T*(1-Math.pow(1-k,3)))+S;if(k<1)requestAnimationFrame(f)})(t0)});
 v.querySelectorAll('.bar i').forEach((b,k)=>{b.style.width='0';setTimeout(()=>b.style.width=b.dataset.w,250+k*90)})}
/* router */
const PAGES=['home','about','work','services','reviews','contact','privacy','terms'];
function route(){const [p0,sub]=(location.hash||'#home').slice(1).split('/'),p=PAGES.includes(p0)?p0:'home';
 if(p==='services')renderServices(sub);
 if(p==='contact'){if(pick)$('#s').value=[...$('#s').options].map(o=>o.value).find(v=>v.startsWith(pick))||$('#s').value;$('#ff').style.display='';$('#ok').classList.remove('on')}
 $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+p));
 $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===p));
 $$('#sb a').forEach(a=>a.classList.toggle('on',a.getAttribute('href').slice(1).split('/')[0]===p&&!a.closest('.sub')));
 $('#main').scrollTop=0;pick='';reveal($('#v-'+p))}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
